steps:
  # Bước 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/llm-gateway', '.']

  # Bước 2: Push image lên Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/llm-gateway']

  # Bước 3: Deploy lên Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'llm-gateway'
      - '--image=gcr.io/$PROJECT_ID/llm-gateway'
      - '--region=asia-southeast1'        # Singapore (gần Việt Nam nhất)
      - '--platform=managed'
      - '--allow-unauthenticated'          # Cho phép gọi API không cần login Google
      - '--port=8080'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest'  # Lấy key từ Secret Manager

images:
  - 'gcr.io/$PROJECT_ID/llm-gateway'
