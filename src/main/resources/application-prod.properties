server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

alphavantage.api.key=${ALPHAVANTAGE_API_KEY}
alphavantage.api.url=${ALPHAVANTAGE_API_URL:https://www.alphavantage.co/query}

openai.api.key=${OPENAI_API_KEY}
openai.api.url=${OPENAI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
openai.default-model=${OPENAI_DEFAULT_MODEL}

spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never