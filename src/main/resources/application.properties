# ===== Server =====
server.port=8083
server.forward-headers-strategy=framework

# ===== H2 Standalone Database for 24/7 Phone Deployment =====
spring.datasource.url=jdbc:h2:file:./data/fnmf;DB_CLOSE_DELAY=-1;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JWT Security Configuration =====
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# ===== Alpha Vantage Financial Market Data Configuration =====
alphavantage.api.key=${ALPHAVANTAGE_API_KEY:}
alphavantage.api.url=https://www.alphavantage.co/query

# ===== LLM API Configuration =====
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
openai.default-model=gemini-2.0-flash

# ===== Springdoc / Swagger UI Configuration =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.path=/v3/api-docs

# ===== H2 Web Console (Database Viewer GUI) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

