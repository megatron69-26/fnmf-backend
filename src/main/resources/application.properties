# ===== Server =====
server.port=8082

# ===== Oracle Database Configuration =====
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=khoi2
spring.datasource.password=khoi2
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ===== JWT Security Configuration =====
jwt.secret=fnmf_secret_key_jwt_2026_super_secure_key_for_mobile_banking_app_khoid
jwt.expiration-ms=86400000

# ===== LLM API Configuration =====
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
openai.default-model=gemini-2.0-flash

# ===== Rate Limiting =====
gateway.rate-limit.max-requests=20
gateway.rate-limit.window-seconds=60

# ===== Retry =====
gateway.retry.max-attempts=3
gateway.retry.delay-ms=1000
